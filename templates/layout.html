{% load static %}
{% load pwa %}
{% progressive_web_app_meta %}

<!doctype html>
<html lang="en">
  <head>
    <title>{% block title %}Watchlist Manager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'css/thunder_logo.png' %}" />
    <link rel="shortcut icon" type="image/png" href="{% static 'css/thunder_logo.png' %}" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'react/main.css' %}" />
  </head>
  <body>
    <div class="wrapper">
      {% block body %}
      {% endblock body %}
    </div>
    <script type="module" src="{% static 'react/main.js' %}"></script>
  </body>
</html>
